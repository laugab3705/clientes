server.port=8081
spring.application.name=servicio-inventario

# PostgreSQL (Puerto 5434 configurado en docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5434/inventario_db
spring.datasource.username=inventario
spring.datasource.password=inventario
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true